<!doctype html>
<html lang="en">
<head>

  <meta name="robots" content="noindex" />
  <title>Page not found | AWS in Plain English</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(to bottom, hsl(30 10% 8%) 0%, hsl(30 10% 10%) 100%);
      color: hsl(40 7% 95%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .code {
      font-size: clamp(72px, 18vw, 160px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(180deg, #FF9900 0%, #cc7a00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 16px;
    }
    h1 {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: hsl(40 7% 70%);
      max-width: 420px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }
    a.button {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      background: #FF9900;
      color: #1a1408;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
    }
    a.button:hover { background: #ffad33; }

</head>
<body>
  <main>
    <div class="code">404</div>

</html>
