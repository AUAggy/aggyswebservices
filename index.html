<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#FF9900" />

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AWS in Plain English",
      "description": "A beautifully designed educational resource that explains 69 AWS services using clear analogies and real-world examples. No jargon, no confusion: just straightforward explanations.",
      "url": "https://aggyswebservices.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://aggyswebservices.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AWS in Plain English",
      "url": "https://aggyswebservices.com/",
      "logo": "https://aggyswebservices.com/apple-touch-icon.png"
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
